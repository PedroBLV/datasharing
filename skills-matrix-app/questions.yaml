# Skills matrix questions.
#
# Each question belongs to a capability_area (must match an id in
# capabilities.yaml). Questions are answered on the shared 1-5 maturity
# scale defined in capabilities.yaml, so they assess practical and
# delivery experience rather than only theoretical awareness.
#
# Fields:
#   id              Unique, stable identifier (do not reuse old ids for
#                   new questions - historical responses are keyed on it).
#   capability_area Capability id from capabilities.yaml.
#   text            The question shown to the respondent.
#   weight          Relative importance within its capability area.
#   response_type   Currently only "maturity_1_5" is supported.
#
# Add or edit questions freely; the application loads them at runtime.

version: 1
default_response_type: maturity_1_5

questions:
  # --- AI Fundamentals ---
  - id: ai_fundamentals_core
    capability_area: ai_fundamentals
    text: Rate your experience with core machine learning concepts (training, evaluation, overfitting, bias/variance).
    weight: 1.0
    response_type: maturity_1_5
  - id: ai_fundamentals_llm_basics
    capability_area: ai_fundamentals
    text: Rate your understanding of how large language models work (tokens, context windows, embeddings).
    weight: 1.0
    response_type: maturity_1_5

  # --- Generative AI ---
  - id: genai_prompting
    capability_area: generative_ai
    text: Rate your experience designing and iterating on prompts for production use cases.
    weight: 1.0
    response_type: maturity_1_5
  - id: genai_app_building
